# Forward packets for Tailscale exit-node clients.
# https://tailscale.com/kb/1019/subnets#enable-ip-forwarding
#
# IPv6 forwarding is safe here: NetworkManager handles router advertisements in
# userspace (kernel accept_ra=0 on managed links), so forwarding=1 doesn't drop
# the RA-learned default route.
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1
