# herdr — terminal workspace manager for AI coding agents.
# Symlinked to ~/.config/herdr/config.toml by `init shell`.
# Full defaults: herdr --default-config
# Apply without restart: herdr server reload-config   (or prefix+shift+r)

onboarding = false

[theme]
# Same palette as kitty and nvim. Built-ins: catppuccin, terminal, tokyo-night,
# dracula, nord, gruvbox, one-dark, solarized, kanagawa, rose-pine, vesper.
name = "catppuccin"
auto_switch = false

[keys]
# Match tmux muscle memory. herdr's default is ctrl+b.
prefix = "ctrl+a"

# --- unset by default, worth binding when running a herd ---
# Jump straight to agent N in the sidebar. The reason to use herdr over tmux.
focus_agent = "prefix+alt+1..9"
next_workspace = "prefix+shift+right"
previous_workspace = "prefix+shift+left"
# prefix+tab already cycles panes; this is global back-and-forth.
last_pane = "prefix+space"
switch_workspace = "prefix+shift+1..9"

# Popups are session-modal: they don't disturb the pane layout.
[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "git log --oneline --graph --decorate --all -n 200"
description = "git graph"
width = "85%"
height = "80%"

[[keys.command]]
key = "prefix+alt+p"
type = "popup"
command = "gh pr list && read -n1 -r -p 'enter to close'"
description = "open PRs"
width = "85%"
height = "60%"

[worktrees]
# prefix+shift+g creates a worktree AND a workspace for it in one keystroke.
directory = "~/.herdr/worktrees"

[ui]
# "priority" sorts the agent panel as an attention queue — whoever is blocked on
# you floats to the top. With 4+ agents this is the whole game.
agent_panel_sort = "priority"

# Which agent is in which split, without naming panes by hand.
show_agent_labels_on_pane_borders = true

# Don't prompt for a name on every new tab.
prompt_new_tab_name = false

# Less chrome when a workspace has one tab.
hide_tab_bar_when_single_tab = true

sidebar_width = 26

[ui.sidebar.agents]
rows = [["state_icon", "workspace", "tab"], ["agent"]]

[ui.sidebar.agents.rows_by_agent]
# Extra row for Claude: read what each agent is actually doing from the sidebar.
claude = [
  ["state_icon", "workspace", "tab"],
  ["terminal_title_stripped"],
  ["agent"],
]

[ui.toast]
# Default is "off". "system" goes to the OS notification service, which survives
# the terminal not being focused — the point, when agents run unattended.
delivery = "system"
delay_seconds = 1

[ui.sound]
# Replaces the old Claude Stop-hook chime, which couldn't tell "finished" from
# "needs your attention". finish.mp3 is the same file that hook played.
enabled = true
done_path = "sounds/finish.mp3"

[session]
resume_agents_on_restore = true

[remote]
# `herdr --remote <host>` — adds ServerAliveInterval/CountMax on top of
# ~/.ssh/config and reuses one authenticated connection per attach.
manage_ssh_config = true

[advanced]
# tmux was at history-limit 9999999; default here is 10MB.
scrollback_limit_bytes = 50000000
