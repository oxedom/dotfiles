# Terminal / color support (fixes TERM so shell PS1 colors + Kitty truecolor work)
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:RGB"

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# switch windows using Shift-arrow without prefix
bind -n S-Left previous-window
bind -n S-Right next-window

# ---------------------------------------------------------------- herdr
# herdr runs *inside* tmux, and both want the same keys. tmux wins every time:
# root-table bindings (`bind -n`) are consumed before the pane ever sees them,
# and tmux has no idea when herdr is mid-prefix.
#
# F12 hands the entire keyboard to the pane. In passthrough mode tmux has no
# prefix and no root bindings, so shift+arrows, alt+arrows and ctrl+b all reach
# herdr untouched. F12 again takes tmux back. The status bar greys out while off.
#
# This is also what you want after `ssh devbox` — one key, and the remote
# herdr behaves exactly as it does locally.
bind -T root F12 \
  set prefix None \;\
  set key-table off \;\
  set status-style 'fg=colour245,bg=colour238' \;\
  set window-status-current-style 'fg=colour245,bg=colour238' \;\
  display-message -d 750 'tmux: passthrough ON — F12 to return' \;\
  refresh-client -S

bind -T off F12 \
  set -u prefix \;\
  set -u key-table \;\
  set -u status-style \;\
  set -u window-status-current-style \;\
  display-message -d 750 'tmux: passthrough OFF' \;\
  refresh-client -S

# Increase the scrollback buffer to a higher limit than the default 2000 lines
set -g history-limit 9999999

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# clock mode
setw -g clock-mode-colour yellow

# copy mode
setw -g mode-style 'fg=black bg=yellow bold'

# panes
set -g pane-border-style 'fg=yellow'
set -g pane-active-border-style 'fg=green'

# statusbar
set -g status-position top
set -g status-justify left
set -g status-style 'fg=green'

set -g status-left ''
set -g status-left-length 10

set -g status-right '#[fg=green,bg=default,bright]#(tmux-mem-cpu-load) #[fg=red,dim,bg=default]#(uptime | cut -f 4-5 -d " " | cut -f 1 -d ",") #[fg=white,bg=default]%a%l:%M:%S %p#[default] #[fg=blue]%Y-%m-%d'

setw -g window-status-current-style 'fg=black bg=green'
setw -g window-status-current-format ' #I #W #F '

setw -g window-status-style 'fg=green bg=black'
setw -g window-status-format ' #I #[fg=white]#W #[fg=yellow]#F '

setw -g window-status-bell-style 'fg=black bg=yellow bold'

# messages
set -g message-style 'fg=black bg=yellow bold'
